name: JARVIS Sentinel
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-jarvis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yt-dlp requests
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_USERNAME: ${{ secrets.TG_USERNAME }}
        run: python monitor.py
      - name: Save memory
        run: |
          git config user.name "JARVIS Bot"
          git config user.email "jarvis@://github.com"
          git add stats.json
          git commit -m "Update YouTube stats memory" || exit 0
          git push

